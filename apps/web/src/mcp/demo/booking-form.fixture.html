<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root {
  --bg: #0b0c0e;
  --surface: rgba(255,255,255,0.045);
  --surface-2: rgba(255,255,255,0.07);
  --border: rgba(255,255,255,0.10);
  --border-strong: rgba(255,255,255,0.18);
  --text: #f2f4f7;
  --muted: #98a1ab;
  --accent: #c8ff3d;
  --accent-ink: #16200a;
  --danger: #ff6b6b;
  --radius: 10px;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  background: transparent;
  color: var(--text);
  font: 400 14px/1.5 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}
.wrap { padding: 16px; }
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 16px;
}
.row { display: flex; gap: 12px; align-items: center; }
.between { display: flex; justify-content: space-between; align-items: center; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.stack { display: flex; flex-direction: column; gap: 12px; }
h1 { font-size: 16px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
h2 { font-size: 13px; font-weight: 600; margin: 0; }
.muted { color: var(--muted); }
.tiny { font-size: 12px; }
.label {
  display: block;
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 5px;
}
input[type="text"], input[type="email"], input[type="date"], select {
  width: 100%;
  height: 38px;
  padding: 0 11px;
  background: rgba(0,0,0,0.28);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font: inherit;
  outline: none;
  transition: border-color .15s, box-shadow .15s;
}
input:focus, select:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(200,255,61,0.13);
}
input::placeholder { color: #5f6871; }
input[aria-invalid="true"] { border-color: var(--danger); }
.extra {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  cursor: pointer;
  transition: border-color .15s, background .15s;
}
.extra:hover { border-color: var(--border-strong); background: var(--surface-2); }
.extra input { accent-color: var(--accent); width: 15px; height: 15px; margin: 0; }
.extra .price { margin-left: auto; color: var(--muted); font-size: 12px; }
button.primary {
  width: 100%;
  height: 42px;
  background: var(--accent);
  color: var(--accent-ink);
  border: 0;
  border-radius: var(--radius);
  font: 600 14px/1 inherit;
  cursor: pointer;
  transition: filter .15s, transform .08s;
}
button.primary:hover { filter: brightness(1.07); }
button.primary:active { transform: scale(0.985); }
button.primary:disabled { opacity: .45; cursor: not-allowed; }
.total { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; }
.divider { height: 1px; background: var(--border); margin: 14px 0; }
.err { color: var(--danger); font-size: 12px; min-height: 15px; }
.mock-banner {
  display: flex; align-items: center; gap: 8px;
  background: rgba(255,193,7,0.10);
  border: 1px solid rgba(255,193,7,0.34);
  color: #ffd75e;
  border-radius: var(--radius);
  padding: 9px 12px;
  font-size: 12px;
  font-weight: 500;
}
.art { width: 92px; height: 42px; flex: none; }
.art svg { width: 100%; height: 100%; }
.done { text-align: center; padding: 26px 16px; }
.check {
  width: 46px; height: 46px; margin: 0 auto 14px;
  border-radius: 50%;
  background: var(--accent); color: var(--accent-ink);
  display: flex; align-items: center; justify-content: center;
  font-size: 24px; font-weight: 700;
  animation: pop .32s cubic-bezier(.2,1.3,.4,1);
}
@keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
.line { display: flex; justify-content: space-between; padding: 5px 0; font-size: 13px; }
.line span:first-child { color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
<div class="card stack">
  <div class="row">
    <div class="art"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 92" width="200" height="92" role="img" aria-label="Toyota suv"><ellipse cx="100" cy="86" rx="82" ry="5" fill="#000" opacity="0.22"/><path d="M 16 66 L 16 50 L 62 44 L 76 20 L 150 20 L 158 44 L 184 48 L 184 66 Z" fill="hsl(7 48% 47%)"/><rect x="16" y="60" width="168" height="6" fill="hsl(7 44% 33%)" opacity="0.4"/><path d="M 67 41 L 78 24 L 148 24 L 153 41 Z" fill="hsl(7 22% 82%)" opacity="0.55"/><circle cx="52" cy="70" r="16" fill="#15171b"/><circle cx="52" cy="70" r="8.8" fill="#2f343c"/><circle cx="52" cy="70" r="2.88" fill="#4a515b"/><circle cx="150" cy="70" r="16" fill="#15171b"/><circle cx="150" cy="70" r="8.8" fill="#2f343c"/><circle cx="150" cy="70" r="2.88" fill="#4a515b"/></svg></div>
    <div style="min-width:0">
      <h1>Toyota RAV4</h1>
      <div class="tiny muted">2026 · petrol · manual · Berlin</div>
    </div>
    <div style="margin-left:auto;text-align:right" class="tiny muted">€61/day · €305/mo</div>
  </div>

  <div class="divider"></div>

  <div class="grid2">
    <div>
      <label class="label" for="name">Full name</label>
      <input id="name" type="text" placeholder="Alex Moreau" autocomplete="off">
    </div>
    <div>
      <label class="label" for="email">Email</label>
      <input id="email" type="email" placeholder="alex@example.com" autocomplete="off">
    </div>
  </div>

  <div class="grid2">
    <div>
      <label class="label" for="start">Pick-up</label>
      <input id="start" type="date" value="2026-09-12">
    </div>
    <div>
      <label class="label" for="end">Return</label>
      <input id="end" type="date" value="2026-09-19">
    </div>
  </div>

  <div>
    <h2 style="margin-bottom:8px">Extras</h2>
    <div class="stack" style="gap:8px">
      <label class="extra">
        <input type="checkbox" data-extra="insurance" data-price="12" data-perday="true">
        <span>Full insurance (zero excess)</span>
        <span class="price">€12/day</span>
      </label><label class="extra">
        <input type="checkbox" data-extra="additional-driver" data-price="7" data-perday="true">
        <span>Additional driver</span>
        <span class="price">€7/day</span>
      </label><label class="extra">
        <input type="checkbox" data-extra="child-seat" data-price="5" data-perday="true">
        <span>Child seat</span>
        <span class="price">€5/day</span>
      </label><label class="extra">
        <input type="checkbox" data-extra="winter-tyres" data-price="4" data-perday="true">
        <span>Winter tyres</span>
        <span class="price">€4/day</span>
      </label>
    </div>
  </div>

  <div class="divider"></div>

  <div id="lines" class="stack" style="gap:0"></div>

  <div class="between" style="margin-top:6px">
    <span class="muted tiny">Total for the period</span>
    <span class="total" id="total">€0</span>
  </div>

  <div class="err" id="err"></div>
  <button class="primary" id="submit">Continue to payment</button>
  <div class="tiny muted" style="text-align:center">No payment is taken at this step.</div>
</div></div>
<script>
(function () {
  var PROTOCOL_VERSION = '2026-01-26';
  var nextId = 1;
  var pending = new Map();
  var lastHeight = 0;

  function post(msg) { window.parent.postMessage(msg, '*'); }

  function request(method, params) {
    var id = nextId++;
    return new Promise(function (resolve, reject) {
      pending.set(id, { resolve: resolve, reject: reject });
      post({ jsonrpc: '2.0', id: id, method: method, params: params });
    });
  }

  function notify(method, params) {
    post({ jsonrpc: '2.0', method: method, params: params });
  }

  function reportSize() {
    var h = Math.ceil(document.documentElement.getBoundingClientRect().height);
    if (h === lastHeight) return;
    lastHeight = h;
    notify('ui/notifications/size-changed', { height: h });
  }

  // The host may hand us its theme tokens; mirror them so the widget tracks the
  // host's appearance instead of hard-coding one.
  function applyHostContext(ctx) {
    if (!ctx || !ctx.styles) return;
    var root = document.documentElement;
    Object.keys(ctx.styles).forEach(function (k) {
      root.style.setProperty(k.startsWith('--') ? k : '--' + k, ctx.styles[k]);
    });
  }

  window.addEventListener('message', function (event) {
    var msg = event.data;
    if (!msg || msg.jsonrpc !== '2.0') return;

    if (msg.method === undefined && msg.id !== undefined) {
      var p = pending.get(msg.id);
      if (!p) return;
      pending.delete(msg.id);
      if (msg.error) p.reject(new Error(msg.error.message || 'host error'));
      else p.resolve(msg.result);
      return;
    }

    if (msg.method === 'ui/notifications/host-context-changed') {
      applyHostContext(msg.params && msg.params.hostContext);
    }
  });

  window.callTool = function (name, args) {
    return request('tools/call', { name: name, arguments: args });
  };
  window.reportSize = reportSize;

  // The guest opens the handshake. If the host never answers we still render —
  // a widget that silently stays blank is worse than one that works uncoupled.
  request('ui/initialize', { protocolVersion: PROTOCOL_VERSION, appCapabilities: {} })
    .then(function (result) {
      notify('ui/notifications/initialized');
      if (result && result.hostContext) applyHostContext(result.hostContext);
      reportSize();
    })
    .catch(function () { reportSize(); });

  if (window.ResizeObserver) new ResizeObserver(reportSize).observe(document.documentElement);
  window.addEventListener('load', reportSize);
})();

const RENTAL = true;
const BASE = 61;
const LISTING_ID = "rent-suv-toyota-0";
const el = (id) => document.getElementById(id);

function days() {
  if (!RENTAL) return 1;
  const a = new Date(el('start').value), b = new Date(el('end').value);
  const d = Math.ceil((b - a) / 86400000);
  return Number.isFinite(d) && d > 0 ? d : 0;
}

function selectedExtras() {
  return [...document.querySelectorAll('[data-extra]')]
    .filter((c) => c.checked)
    .map((c) => ({
      id: c.dataset.extra,
      label: c.closest('.extra').querySelector('span').textContent,
      price: Number(c.dataset.price),
      perDay: c.dataset.perday === 'true',
    }));
}

function compute() {
  const n = days();
  const baseTotal = RENTAL ? BASE * n : BASE;
  const extras = selectedExtras();
  const extrasTotal = extras.reduce((s, e) => s + (e.perDay ? e.price * n : e.price), 0);
  return { n, baseTotal, extras, extrasTotal, total: baseTotal + extrasTotal };
}

function money(v) { return '€' + Math.round(v).toLocaleString('en-IE'); }

function render() {
  const { n, baseTotal, extras, extrasTotal, total } = compute();
  const rows = [];
  rows.push('<div class="line"><span>' + (RENTAL ? money(BASE) + ' x ' + n + ' day' + (n === 1 ? '' : 's') : 'Vehicle') + '</span><span>' + money(baseTotal) + '</span></div>');
  for (const e of extras) {
    rows.push('<div class="line"><span>' + e.label + '</span><span>' + money(e.perDay ? e.price * n : e.price) + '</span></div>');
  }
  if (extras.length === 0) rows.push('<div class="line"><span>No extras</span><span>€0</span></div>');
  el('lines').innerHTML = rows.join('');
  el('total').textContent = money(total);

  const validDates = !RENTAL || n > 0;
  el('err').textContent = validDates ? '' : 'Return date must be after pick-up.';
  el('submit').disabled = !validDates;
  reportSize();
}

document.addEventListener('input', render);
document.addEventListener('change', render);
render();

el('submit').addEventListener('click', () => {
  const name = el('name').value.trim();
  const email = el('email').value.trim();
  if (!name || !email) {
    el('err').textContent = 'Name and email are both needed to hold the booking.';
    el('name').setAttribute('aria-invalid', String(!name));
    el('email').setAttribute('aria-invalid', String(!email));
    return;
  }
  const { extras, total } = compute();
  el('submit').disabled = true;
  el('submit').textContent = 'Submitting…';
  el('err').textContent = '';

  callTool('submit_booking', {
    listingId: LISTING_ID,
    fullName: name,
    email: email,
    startDate: el('start').value,
    endDate: RENTAL ? el('end').value : undefined,
    extras: extras.map((e) => e.id),
    expectedTotal: total,
  }).catch(function (err) {
    // The host owns what happens next on success; we only handle the failure
    // path, so a dropped call doesn't leave the button stuck on "Submitting…".
    el('err').textContent = (err && err.message) || 'Could not submit — please try again.';
    el('submit').disabled = false;
    el('submit').textContent = 'Continue to payment';
    reportSize();
  });
});
</script>
</body>
</html>
